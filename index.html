<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ground X — Planetary Twins</title>
  <meta name="description" content="Ground X compares sites on the Moon and Mars with geologically similar places on Earth, and the rovers suited to them.">
  <meta name="theme-color" content="#232322">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='22' cy='32' r='16' fill='%23bfb29a'/%3E%3Ccircle cx='42' cy='32' r='16' fill='%23d7ffc5' fill-opacity='.9'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Michroma&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=29">
  <script>
    /* Apply the saved language before first paint (avoids a flash of the wrong direction). */
    (function () {
      var l = null;
      try { l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("gx-lang"); } catch (e) {}
      if (l !== "ar" && l !== "en") l = "en";
      try { localStorage.setItem("gx-lang", l); } catch (e) {}
      document.documentElement.lang = l;
      document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      document.documentElement.classList.add("gx-preload");
      var th = null;
      try { th = localStorage.getItem("gx-theme"); } catch (e) {}
      document.documentElement.setAttribute("data-theme", th === "light" ? "light" : "dark");
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>

  <!-- ============ NAV ============ -->
  <header class="nav" id="nav">
    <a class="brand" href="#top" aria-label="Ground X">
      <span class="brand__mark" aria-hidden="true"><i></i><i></i></span>
      <span class="brand__word">GROUND<b>X</b></span>
    </a>
    <nav class="nav__links" aria-label="Main">
      <a href="#how" data-i18n="nav.how"></a>
      <a href="#sites" data-i18n="nav.sites"></a>
      <a href="#compare" data-i18n="nav.compare"></a>
      <a href="#explore" data-i18n="nav.explore"></a>
      <a href="#analogs" data-i18n="nav.analogs"></a>
      <a href="#rovers" data-i18n="nav.rovers"></a>
      <a href="#evidence" data-i18n="nav.evidence"></a>
    </nav>
    <button class="theme-btn" id="themeToggle" type="button" aria-label="Switch theme">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="lang" id="langToggle" type="button" aria-label="Switch language">
      <span class="lang__opt" data-l="en">EN</span>
      <span class="lang__opt" data-l="ar">ع</span>
      <span class="lang__pill" aria-hidden="true"></span>
    </button>
  </header>

  <div class="ambient" aria-hidden="true"><i class="blob blob--a"></i><i class="blob blob--b"></i><i class="blob blob--c"></i></div>

  <main id="main">
    <!-- ============ HERO ============ -->
    <section class="hero" id="top">
      <div class="hero__copy">
        <h1 class="hero__title" data-i18n="hero.title" data-rich data-split></h1>
      </div>

      <div class="twins" aria-hidden="true">
        <div class="twins__orbit"></div>
        <svg class="twins__link" viewBox="0 0 100 90" preserveAspectRatio="none"><path d="M36 42 C 46 30, 52 64, 62 50"/><path d="M79 29 C 86 33, 85 37, 80 42"/></svg>
        <div class="orb orb--moon"><div class="orb__tex globe tex-moon"></div><span class="orb__tag" data-i18n="hero.moon"></span></div>
        <div class="orb orb--mars"><div class="orb__tex globe tex-mars"></div><span class="orb__tag" data-i18n="world.mars"></span></div>
        <div class="orb orb--earth"><div class="orb__tex globe tex-earth"></div><span class="orb__tag" data-i18n="hero.earth"></span></div>
        <div class="twins__badge"><span class="mono">≈</span><b data-i18n="hero.twin"></b></div>
        <p class="twins__hint label"><span class="twins__hint-ico">⟲</span><span data-i18n="hero.drag"></span></p>
      </div>

      <div class="hero__side glass">
        <p class="hero__lead" data-i18n="hero.lead"></p>
        <div class="hero__cta">
          <a class="btn btn--solid magnetic" href="#compare"><span data-i18n="hero.cta1"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg></a>
          <a class="btn btn--ghost magnetic" href="#how"><span data-i18n="hero.cta2"></span></a>
        </div>
      </div>

    </section>

    <!-- ============ MARQUEE ============ -->
    <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>

    <!-- ============ HOW IT WORKS ============ -->
    <section class="section how" id="how">
      <div class="how__head">
        <header class="section__head">
          <p class="kicker"><span class="mono">01</span><span data-i18n="nav.how"></span></p>
          <h2 class="section__title" data-rich data-i18n="how.title" data-rich data-split></h2>
          <p class="section__lead" data-i18n="how.lead"></p>
        </header>
        <dl class="stats">
          <div><dd class="stat__n"><span data-count="1" data-stat="moon">1</span></dd><dt data-i18n="stat.moon"></dt></div>
          <div><dd class="stat__n"><span data-count="4" data-stat="mars">4</span></dd><dt data-i18n="stat.marsN"></dt></div>
          <div><dd class="stat__n"><bdi dir="ltr"><span data-count="5" data-stat="twins">5</span><small data-stat="slots">/10</small></bdi></dd><dt data-i18n="stat.analogs"></dt></div>
          <div><dd class="stat__n"><span data-count="3" data-stat="data">3</span></dd><dt data-i18n="stat.data"></dt></div>
        </dl>
      </div>
      <ol class="steps" id="steps"></ol>
    </section>

    <!-- ============ SITES ============ -->
    <section class="section sites" id="sites">
      <header class="section__head">
        <p class="kicker"><span class="mono">02</span><span data-i18n="nav.sites"></span></p>
        <h2 class="section__title" data-rich data-i18n="sites.title" data-split></h2>
        <p class="section__lead" data-i18n="sites.lead"></p>
      </header>
      <div class="world-tabs" role="tablist" id="worldTabs">
        <button role="tab" class="world-tab is-active" data-world="moon" aria-selected="true"><i class="w-dot w-dot--moon globe"></i><span data-i18n="world.moon"></span><small class="mono">1</small></button>
        <button role="tab" class="world-tab" data-world="mars" aria-selected="false"><i class="w-dot w-dot--mars globe"></i><span data-i18n="world.mars"></span><small class="mono">0</small></button>
        <span class="world-tabs__ink" aria-hidden="true"></span>
      </div>
      <div class="site-grid" id="siteGrid"></div>
    </section>

    <!-- ============ COMPARE ============ -->
    <section class="section compare" id="compare">
      <header class="section__head">
        <p class="kicker"><span class="mono">03</span><span data-i18n="nav.compare"></span></p>
        <h2 class="section__title" data-rich data-i18n="compare.title" data-split></h2>
        <p class="section__lead" data-i18n="compare.lead"></p>
      </header>
      <div id="compareRoot"></div>
    </section>

    <!-- ============ ELEVATION PROFILE ============ -->
    <section class="section profile" id="profile">
      <header class="section__head">
        <p class="kicker"><span class="mono">04</span><span data-i18n="kicker.profile"></span></p>
        <h2 class="section__title" data-rich data-i18n="profile.title" data-split></h2>
        <p class="section__lead" data-i18n="profile.lead"></p>
      </header>
      <figure class="chart" id="profileChart"></figure>
    </section>

    <!-- ============ 3D TERRAIN EXPLORER ============ -->
    <section class="section explore" id="explore">
      <header class="section__head">
        <p class="kicker"><span class="mono">05</span><span data-i18n="explore.kicker"></span></p>
        <h2 class="section__title" data-rich data-i18n="explore.title" data-split></h2>
        <p class="section__lead" data-i18n="explore.lead"></p>
      </header>
      <div class="explore__ui">
        <div class="seg" id="exploreSite" role="tablist"></div>
        <div class="seg" id="exploreMode" role="tablist"></div>
      </div>
      <div class="explore__stage">
        <div class="explore__view" data-x3d="shackleton"></div>
        <div class="explore__view" data-x3d="haughton" hidden></div>
        <dl class="explore__info" id="exploreInfo"></dl>
        <div class="explore__legend" id="exploreLegend"></div>
        <span class="explore__hint label"><i>⟲</i><span data-i18n="explore.drag"></span></span>
      </div>
    </section>

    <!-- ============ EARTH ANALOG LIBRARY ============ -->
    <section class="section analogs" id="analogs">
      <header class="section__head">
        <p class="kicker"><span class="mono">06</span><span data-i18n="analogs.kicker"></span></p>
        <h2 class="section__title" data-rich data-i18n="analogs.title" data-split></h2>
        <p class="section__lead" data-i18n="analogs.lead"></p>
      </header>
      <div class="analog-grid" id="analogGrid"></div>
    </section>

    <!-- ============ ROVERS ============ -->
    <section class="section rovers" id="rovers">
      <header class="section__head">
        <p class="kicker"><span class="mono">07</span><span data-i18n="nav.rovers"></span></p>
        <h2 class="section__title" data-rich data-i18n="rovers.title" data-split></h2>
        <p class="section__lead" data-i18n="rovers.lead"></p>
      </header>
      <div id="roverRoot"></div>
    </section>

    <!-- ============ EVIDENCE ============ -->
    <section class="section evidence" id="evidence">
      <header class="section__head">
        <p class="kicker"><span class="mono">08</span><span data-i18n="nav.evidence"></span></p>
        <h2 class="section__title" data-rich data-i18n="evidence.title" data-split></h2>
        <p class="section__lead" data-i18n="evidence.lead"></p>
      </header>
      <div class="seg gallery-filter" id="galleryFilter" role="tablist"></div>
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- ============ METHOD & SOURCES ============ -->
    <section class="section method" id="method">
      <div class="method__grid">
        <div>
          <p class="kicker"><span class="mono">09</span><span data-i18n="kicker.method"></span></p>
          <h2 class="section__title" data-rich data-i18n="method.title" data-split></h2>
          <ul class="method__list" id="methodList"></ul>
        </div>
        <div>
          <h3 class="method__sub" data-i18n="sources.title"></h3>
          <ol class="sources" id="sources"></ol>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__terrain" aria-hidden="true"></div>
    <div class="footer__inner">
      <div class="footer__big" aria-label="Ground X"><span class="footer__word">GROUND</span><span class="footer__x">X</span></div>
      <div class="footer__row">
        <div class="footer__text"><p data-i18n="footer.line"></p><p class="footer__note" data-i18n="terrain.note"></p></div>
        <a href="#top" class="btn btn--solid footer__top magnetic"><span data-i18n="footer.top"></span></a>
      </div>
    </div>
  </footer>

  <!-- Lightbox -->
  <dialog class="lightbox" id="lightbox" aria-label="Image viewer">
    <button class="lightbox__close" type="button" data-close aria-label="Close">×</button>
    <img alt="">
    <p class="lightbox__cap"></p>
  </dialog>

  <aside class="ruler" id="ruler">
    <div class="ruler__track" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <i class="ruler__rail" aria-hidden="true"></i>
      <i class="ruler__fill" aria-hidden="true"></i>
      <div class="ruler__ticks"></div>
      <i class="ruler__mark" aria-hidden="true"><b class="ruler__cur mono">00</b></i>
    </div>
  </aside>

  <div class="cursor" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <!-- GSAP (all plugins are free since GSAP 3.13) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollToPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

  <script src="assets/data/profile.js?v=29"></script>
  <script src="assets/data/terrain.js?v=29"></script>
  <script src="assets/data/haughton-dem.js?v=29"></script>
  <script src="assets/js/data.js?v=29"></script>
  <script src="assets/js/i18n.js?v=29"></script>
  <script src="assets/js/terrain.js?v=29"></script>
  <script src="assets/js/app.js?v=29"></script>
  <script src="assets/js/globes.js?v=29"></script>
</body>
</html>
